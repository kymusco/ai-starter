# yaml-language-server: $schema=https://kymus.io/schemas/kymus.v1.json
#
# A arquitetura do app, como codigo. Tres servicos na mesma rede privada:
#
#   visitante -> web (Next.js) -> agent (Mastra) -> db (PostgreSQL + pgvector)
#   voce -> Studio (servido pelo agent, com login)
#
# O endereco publico do agente existe para o Studio, e tudo nele exige login. O web
# chama pela rede privada, com um token que so vale para o chat. A chave do modelo
# mora so no agente. `npx kymus deploy` cria os tres a partir deste arquivo; a pasta
# de cada servico de codigo e apps/<servico>.
version: 1
environments:
  production:
    services:
      db:
        type: postgresql

      agent:
        type: nodejs
        port: 4111
        exposed: true
        # Imagem so com o resultado do build (apps/agent/Dockerfile): menor e mais rapida.
        source:
          build:
            pack: dockerfile
        variables:
          DATABASE_URL: postgresql://${{ db.POSTGRES_USER }}:${{ db.POSTGRES_PASSWORD }}@${{ db.HOST }}:${{ db.PORT }}/${{ db.POSTGRES_DB }}
          MODEL: openai/gpt-5-mini
          EMBEDDING_MODEL: openai/text-embedding-3-small
          OPENAI_API_KEY:
            secret: true
          # Login do Studio e token do web. Gere os dois com `npm run secrets`.
          STUDIO_TOKEN:
            secret: true
          AGENT_API_TOKEN:
            secret: true
          # Limite de uso do chat: por visitante e por IP (por hora), e o teto do dia.
          CHAT_LIMIT_VISITOR_HOUR: "30"
          CHAT_LIMIT_IP_HOUR: "100"
          CHAT_LIMIT_TOTAL_DAY: "2000"
          # Traces e metricas: dias de historico. Avaliacoes: fracao das respostas (0 desliga).
          OBSERVABILITY_RETENTION_DAYS: "14"
          EVAL_SAMPLE_RATE: "0.1"

      web:
        type: nodejs
        port: 3000
        exposed: true
        start: npm start
        variables:
          AGENT_URL: ${{ agent.URL }}
          # O mesmo token do agente: no agente, ele so abre o chat.
          AGENT_API_TOKEN:
            secret: true

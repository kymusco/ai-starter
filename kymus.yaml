# yaml-language-server: $schema=https://kymus.io/schemas/kymus.v1.json
#
# A arquitetura do app, como codigo. Tres servicos na mesma rede privada:
#
#   navegador -> web (Next.js, publico) -> agent (Mastra, privado) -> db (PostgreSQL + pgvector)
#
# O agente nao tem endereco publico: so o web fala com ele. A chave do modelo
# mora so no agente. `npx kymus deploy` cria os tres a partir deste arquivo; a pasta
# de cada servico de codigo e apps/<servico>.
version: 1
environments:
  production:
    services:
      db:
        type: postgresql

      agent:
        type: nodejs
        port: 4111
        exposed: false
        start: npm start
        variables:
          DATABASE_URL: postgresql://${{ db.POSTGRES_USER }}:${{ db.POSTGRES_PASSWORD }}@${{ db.HOST }}:${{ db.PORT }}/${{ db.POSTGRES_DB }}
          MODEL: openai/gpt-5-mini
          EMBEDDING_MODEL: openai/text-embedding-3-small
          OPENAI_API_KEY:
            secret: true
          # Limite de uso do chat: por visitante e por IP (por hora), e o teto do dia.
          CHAT_LIMIT_VISITOR_HOUR: "30"
          CHAT_LIMIT_IP_HOUR: "100"
          CHAT_LIMIT_TOTAL_DAY: "2000"
          # Traces e metricas: dias de historico. Avaliacoes: fracao das respostas (0 desliga).
          OBSERVABILITY_RETENTION_DAYS: "14"
          EVAL_SAMPLE_RATE: "0.1"

      web:
        type: nodejs
        port: 3000
        exposed: true
        start: npm start
        variables:
          AGENT_URL: ${{ agent.URL }}
          # Senha da tela /admin, que aprova os chamados urgentes (12 caracteres ou mais).
          ADMIN_PASSWORD:
            secret: true
